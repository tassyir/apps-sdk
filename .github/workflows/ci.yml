name: CI

# Every pull request (forks included: no secret is used) and every push to main.
# Actions are pinned to commit SHAs; the comment names the release.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No dependency needs an install script; skipping them keeps a
      # compromised package from running code at install time.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Repo rules (public names, exact dev versions, no registry or secret in .npmrc)
        run: npm run check:repo

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Packages as a consumer sees them (publint, attw, require and import)
        run: npm run check:packages

      # Every TypeScript sample of docs/guides, typechecked against this
      # commit's tarballs (the rest of the guides' checks run in npm test).
      - name: Developer guides' code samples
        run: npm run check:guides

      # The packed create-tassyir-app generates a project, which installs
      # (@tassyir/* from this commit's tarballs, the rest from npm), then
      # passes its own validate, typecheck, test and build, and starts.
      - name: Generated project (create-tassyir-app)
        run: npm run check:template

      - name: npm pack --dry-run of every package
        run: npm run pack:dry-run

      # The release path without publishing: what Changesets would publish to
      # npm, and the GitHub Packages mirror as a dry run (private packages
      # included, so the step exercises every tarball).
      - name: Release dry run
        run: |
          npx changeset publish-plan
          node scripts/mirror-to-github-packages.mjs --dry-run --from-workspace --include-private

  docs:
    name: Docs site (Mintlify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # site/ against its sources: the guides' pages and navigation in
      # front-matter order, one page per error code, the package pages, the
      # OpenAPI copy, nothing published by accident (npm run docs:sync repairs).
      - name: Site in step with its sources (navigation spec)
        run: npx vitest run scripts/docs-site.test.mjs scripts/lib/docs-site.test.mjs

      # The pinned Mintlify CLI (MINT_VERSION in scripts/lib/docs-site.mjs, no
      # install scripts, telemetry off): docs.json and every page build, no
      # broken link or anchor, and the built routes are exactly the navigation
      # plus the API reference.
      - name: Mintlify validate, broken links, routes
        run: npm run docs:check
